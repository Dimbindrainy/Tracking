<!DOCTYPE html>
<html>
<head>
    <title>Tracking App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>Tracking...</h1>
        <button id="insertButton">Insert</button>
    </div>
    <div class="amounts">
        <div class="amount-card">
            <span>Paid until now</span>
            <strong id="paidAmount">1,250 kr</strong>
        </div>

        <div class="amount-card">
            <span>Left to pay</span>
            <strong id="leftToPay">850 kr</strong>
        </div>

        <div class="amount-card">
            <span>Total to pay</span>
            <strong id="totalToPay">2,100 kr</strong>
        </div>
    </div>
    <div class="table-toolbar">
        <input
            type="text"
            id="searchInput"
            placeholder="Search by description, amount or date..."
        >
    </div>
    <table class="income-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Income description</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="incomeTableBody">
        </tbody>
    </table>
    <div id="incomeModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2>Add new income</h2>
                <button id="closeModal">&times;</button>
            </div>

            <form id="incomeForm">

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="description">Income description</label>
                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="e.g. Salary"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="e.g. 1250"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <button type="submit" class="saveButton">
                    Save income
                </button>

            </form>

        </div>

    </div>
<script src="{{ url_for('static', filename='script.js') }}"></script>    
</body>
</html>
